name: Check reflection
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test the experiment models and page
        run: node --test
      - name: Build the static site
        run: node scripts/build.mjs
